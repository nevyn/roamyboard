<text x="1055" y="100" font-size="15" font-weight="bold" fill="#222">C   header flat, pins bent 8° at the joint plane</text>
<text x="1055" y="370" fill="#444">The pin stays on its axis up to the joint plane, then follows</text>
<text x="1055" y="388" fill="#444">the neighbour's bore. The case pivots the neighbour about this</text>
<text x="1055" y="406" fill="#444">axis.</text>
