<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 470" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="1560" height="470" fill="#fbfbf8"/>
<text x="20" y="28" font-size="17" font-weight="bold" fill="#222">Header and socket at the joint, seen along the pin row. Backs up: boards at the bottom, connectors standing on them.</text>
<text x="20" y="48" fill="#555">Both bodies float on S-shaped tails, pin axis about 2.3 mm above the board (to be measured). Board gap 4.0 mm, joint plane 2.0 mm from each edge, socket mouth at the joint plane.</text>
<text x="15" y="100" font-size="15" font-weight="bold" fill="#222">A   0°, as in your photo</text>
<text x="15" y="370" fill="#444">Feet on both boards, bodies coaxial: the pair mates.</text>
