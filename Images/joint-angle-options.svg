<text x="535" y="100" font-size="15" font-weight="bold" fill="#222">B   header soldered tilted 8° (the 8° jig)</text>
<text x="535" y="370" fill="#444">Tilting about the foot tip lifts the pin line 1.1 mm at the</text>
<text x="535" y="388" fill="#444">joint plane: parallel to the neighbour's bore, but above it.</text>
<text x="535" y="406" fill="#444">Misses.</text>
