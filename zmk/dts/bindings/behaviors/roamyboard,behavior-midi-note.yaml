# SPDX-License-Identifier: MIT

description: |
  Sends a MIDI note on, channel 1, velocity 100, to the host on the active Bluetooth profile
  when the key goes down, and its note off when the key comes up. The parameter is the MIDI
  note number, 0 to 127; 60 is middle C (C4). It runs on the central.
  zmk/dts/behaviors/midi.dtsi defines &midi_note; docs/midi.md describes BLE-MIDI.

compatible: "roamyboard,behavior-midi-note"

include: one_param.yaml
