# Build matrix for .github/workflows/build.yml. The board is the nice!nano v2
# (nice_nano//zmk, default revision 2.0.0). docs/firmware.md describes the builds.
---
include:
  - board: nice_nano//zmk
    shield: roamyboard nice_view_adapter nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: roamyboard
  - board: nice_nano//zmk
    shield: roamyboard_left nice_view_adapter nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: roamyboard_left
  - board: nice_nano//zmk
    shield: roamyboard_right nice_view_adapter nice_view
    artifact-name: roamyboard_right
