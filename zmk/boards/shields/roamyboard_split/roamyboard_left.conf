# Releasing every held key when the key module count changes queues more events
# than ZMK's default of 4.
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=32

# ATT buffers are shared by the hosts and the split link. ZMK's split discovery
# ends without subscribing when it cannot get one (docs/firmware.md, Split
# clients), so the central keeps more than ZMK's 10.
CONFIG_BT_ATT_TX_COUNT=16
