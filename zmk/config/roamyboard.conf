# User settings for every roamyboard build. ZMK Studio is enabled per build in
# build.yaml, since the split peripheral cannot host it.

# Longer wireless range.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# No deep sleep: the chain is polled, so no key press can wake the nRF52840
# from System OFF.
CONFIG_ZMK_SLEEP=n

# Soft off for the System layer's power key. Only the reset button wakes the
# keyboard, since the polled chain cannot be a wake source.
CONFIG_ZMK_PM_SOFT_OFF=y

# The roamyboard status screen (zmk/src/display) replaces the nice!view's own
# status widget, which ZMK turns on by default.
CONFIG_NICE_VIEW_WIDGET_STATUS=n
