# User settings for every roamyboard build. ZMK Studio is enabled per build in
# build.yaml, since the split peripheral cannot host it.

# Longer wireless range.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# No deep sleep: the chain is polled, so no key press can wake the nRF52840
# from System OFF.
CONFIG_ZMK_SLEEP=n
