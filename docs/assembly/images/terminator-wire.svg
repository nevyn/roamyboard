<text x="446" y="596.48" font-size="15" fill="#6b6577">row 3 (board y 115.1):</text>
<text x="446" y="616.48" font-size="15" font-weight="700" fill="#6b6577">no row 3 header</text>
<text x="640" y="142" font-size="17" font-weight="700" fill="#1d1a24">One insulated wire</text>
<text x="640" y="168" font-size="15" fill="#1d1a24">at most 1.3 mm in diameter. It joins</text>
<text x="640" y="188.25" font-size="15" fill="#1d1a24">the feet of</text>
<text x="640" y="214" font-size="15" font-weight="700" fill="#d64541">row 1 pin 2 (+3.3V)</text>
<text x="640" y="236" font-size="15" font-weight="700" fill="#2b6cb0">and row 2 pin 3 (DATA).</text>
<text x="640" y="276" font-size="15" fill="#6b6577">This ties DATA to +3.3V, so the chain</text>
<text x="640" y="296.25" font-size="15" fill="#6b6577">reads the sentinel after the last</text>
<text x="640" y="316.5" font-size="15" fill="#6b6577">key module.</text>
<text x="640" y="352" font-size="15" fill="#6b6577">Pin 1 is the topmost pin of each</text>
<text x="640" y="372.25" font-size="15" fill="#6b6577">header, toward the SW5 end.</text>
<rect x="626" y="400" width="312" height="84" rx="8" fill="#fbeee7" stroke="#c9481a" stroke-width="1.6"/>
<text x="640" y="428" font-size="15" font-weight="700" fill="#c9481a">Solder the wire before printing:</text>
<text x="640" y="448.25" font-size="15" font-weight="700" fill="#c9481a">the headers go into the print at</text>
<text x="640" y="468.5" font-size="15" font-weight="700" fill="#c9481a">the embed pause.</text>
