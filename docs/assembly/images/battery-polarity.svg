<text x="810" y="352" font-size="14" text-anchor="end" fill="#6b6577">jack on the</text>
<text x="810" y="370.9" font-size="14" text-anchor="end" fill="#6b6577">MCU module</text>
<text x="810" y="392" font-size="14" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#6b6577">JST S2B-PH-K-S</text>
<text x="852" y="426" font-size="14" text-anchor="middle" font-weight="700" fill="#c9481a">Plug in only</text>
<text x="852" y="444.9" font-size="14" text-anchor="middle" font-weight="700" fill="#c9481a">after the check.</text>
<rect x="36" y="474" width="520" height="96" rx="8" fill="#fbeee7" stroke="#c9481a" stroke-width="1.6"/>
<text x="56" y="504" font-size="15" font-weight="700" fill="#c9481a">Neither the JST nor the battery's datasheet says which</text>
<text x="56" y="524.25" font-size="15" font-weight="700" fill="#c9481a">pin carries +. Measure the plug; the lead colours are</text>
<text x="56" y="544.5" font-size="15" font-weight="700" fill="#c9481a">only a convention.</text>
<text x="584" y="504" font-size="15" fill="#1d1a24">Put the red probe on one contact and the</text>
<text x="584" y="524.25" font-size="15" fill="#1d1a24">black on the other. If the reading is</text>
<text x="584" y="544.5" font-size="15" fill="#1d1a24">negative, the black probe is on +.</text>
<line x1="36" y1="618" x2="924" y2="618" stroke="#d8d1c4" stroke-width="1.2"/>
