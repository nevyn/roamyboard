<line x1="660" y1="738" x2="775" y2="738" stroke="#d64541" stroke-width="2.5"/>
<text x="640" y="712" font-size="14" text-anchor="middle" fill="#6b6577">switch</text>
<line x1="530" y1="768" x2="775" y2="768" stroke="#1d1a24" stroke-width="2.5"/>
<text x="450" y="818" font-size="15" fill="#1d1a24">The switch goes between battery + and the</text>
<text x="450" y="838.25" font-size="15" fill="#1d1a24">nice!nano's B+ pad. Battery - goes to B-.</text>
<text x="450" y="870" font-size="15" font-weight="600" fill="#1d1a24">The common terminal beeps to one other</text>
<text x="450" y="890.25" font-size="15" font-weight="600" fill="#1d1a24">terminal in each slider position, a different</text>
<text x="450" y="910.5" font-size="15" font-weight="600" fill="#1d1a24">one each time. Find it before soldering.</text>
