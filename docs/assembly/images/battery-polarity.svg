<text x="450" y="773" font-size="15" font-weight="700" fill="#1d1a24">battery -</text>
<line x1="530" y1="738" x2="620" y2="738" stroke="#d64541" stroke-width="2.5"/>
<circle cx="620" cy="738" r="3.5" fill="#1d1a24" stroke="none" stroke-width="1"/>
