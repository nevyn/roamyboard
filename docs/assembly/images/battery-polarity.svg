<text x="50" y="661.5" font-size="16" text-anchor="middle" font-weight="700" fill="#ffffff">2</text>
<text x="76" y="662" font-size="17" font-weight="700" fill="#1d1a24">Find the power switch's common terminal with a continuity tester.</text>
