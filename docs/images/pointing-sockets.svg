<text x="456.0" y="175.6" font-size="10" text-anchor="middle" font-weight="normal" fill="#555" font-family="Helvetica, Arial, sans-serif">pin 1 toward the SW5 end</text>
<text x="30.0" y="640.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Glue each socket into its cradle with epoxy: mouth toward V's socket face, pin 1 toward the SW5 end. Keep the glue off the tails.</text>
<text x="30.0" y="658.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Wire each tail to the J_LEFT pad with the same connector and pin number: nine wires, each straight across.</text>
<text x="30.0" y="676.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Five of those pads already carry a trackpad wire: the socket's wire goes onto the same pad.</text>
<text x="30.0" y="694.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Leave slack in every wire: the floor folds over onto the shell when the module closes.</text>
