<text x="713.1" y="262.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#e67e22" font-family="Helvetica, Arial, sans-serif">5</text>
<text x="858.1" y="160.0" font-size="11" text-anchor="start" font-weight="normal" fill="#2ca02c" font-family="Helvetica, Arial, sans-serif">to pin 16</text>
<rect x="756.2" y="236.0" width="20" height="4" fill="#c9a227"/>
<polyline points="766.2,202.0 766.2,236.0 774.2,236.0" fill="none" stroke="#bbb" stroke-width="4"/>
<text x="766.2" y="262.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555" font-family="Helvetica, Arial, sans-serif">6</text>
<text x="630.0" y="286.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Pin 5's foot clears its pad by about 0.5 mm.</text>
<text x="630.0" y="302.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">The pad stays on the GND pour: keep it bare.</text>
<text x="30.0" y="590.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">1. Heat pin 5's joint and lift the foot with tweezers or a fine pick, bending the leg at its knee, until it clears the pad.</text>
<text x="30.0" y="608.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">2. Wick the pad flat, so that no solder can bridge to the lifted foot. Pins 4 and 6 stay soldered: they are GND.</text>
<text x="30.0" y="626.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">3. Solder a short piece of thin insulated wire (wire-wrap wire) from pin 5's foot tip to pin 16's joint, over the package.</text>
<text x="30.0" y="644.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">4. Check with a meter: continuity from pin 5 to pin 16, none from pin 5 to pin 4, 6 or 8.</text>
</svg>
