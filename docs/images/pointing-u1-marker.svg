<polyline points="660.0,202.0 660.0,236.0 668.0,236.0" fill="none" stroke="#bbb" stroke-width="4"/>
<text x="660.0" y="262.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#555555" font-family="Helvetica, Arial, sans-serif">4</text>
<rect x="703.1" y="236.0" width="20" height="4" fill="#c9a227"/>
<polyline points="713.1,202.0 713.1,216.0 719.1,198.0 735.1,190.0" fill="none" stroke="#e67e22" stroke-width="4"/>
