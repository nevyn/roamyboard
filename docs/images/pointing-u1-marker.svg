<text x="30.0" y="36.0" font-size="16" text-anchor="start" font-weight="bold" fill="#222" font-family="Helvetica, Arial, sans-serif">Mark K's board as a pointing module</text>
<text x="30.0" y="56.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">U1 (74HC165) on the board's back: lift pin 5 (input G) off its pad and wire it to pin 16 (+3.3V).</text>
<text x="30.0" y="72.0" font-size="11" text-anchor="start" font-weight="normal" fill="#555" font-family="Helvetica, Arial, sans-serif">Back view, as the board lies in the jig: SW5 end up, header side left. The pin 1 corner of the package is bevelled or dotted.</text>
