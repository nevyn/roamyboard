<text x="471.3" y="517.7" font-size="12" text-anchor="end" font-weight="bold" fill="#d62728" font-family="Helvetica, Arial, sans-serif">pin 16 = +3.3V (VCC)</text>
<text x="261.8" y="155.2" font-size="12" text-anchor="middle" font-weight="bold" fill="#e67e22" font-family="Helvetica, Arial, sans-serif">pin 5 = input G: lifted</text>
<text x="289.7" y="386.8" font-size="12" text-anchor="middle" font-weight="normal" fill="#2ca02c" font-family="Helvetica, Arial, sans-serif">insulated wire over the package</text>
<text x="640.0" y="136.0" font-size="13" text-anchor="start" font-weight="bold" fill="#222" font-family="Helvetica, Arial, sans-serif">Side view of pins 4, 5 and 6</text>
