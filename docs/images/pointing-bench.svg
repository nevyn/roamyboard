<text x="646.0" y="211.1" font-size="11" text-anchor="start" font-weight="bold" fill="#d62728" font-family="Helvetica, Arial, sans-serif">pin 2 +3.3V  to the pad's VDDHI</text>
<rect x="484.0" y="210.664" width="12" height="6" fill="#111"/>
<polyline points="496.0,213.7 560.0,213.7 590.0,231.1 640.0,231.1" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round"/>
<text x="646.0" y="235.1" font-size="11" text-anchor="start" font-weight="bold" fill="#222222" font-family="Helvetica, Arial, sans-serif">pin 3 GND  to the pad's VSS</text>
