<text x="646.0" y="335.3" font-size="10" text-anchor="start" font-weight="normal" fill="#999" font-family="Helvetica, Arial, sans-serif">pin 1 LED: leave empty</text>
<rect x="484.0" y="352.26" width="12" height="6" fill="#111"/>
<polyline points="496.0,355.3 560.0,355.3 590.0,355.3 640.0,355.3" fill="none" stroke="#1f77b4" stroke-width="3" stroke-linejoin="round"/>
<text x="646.0" y="359.3" font-size="11" text-anchor="start" font-weight="bold" fill="#1f77b4" font-family="Helvetica, Arial, sans-serif">pin 2 SDA  to the pad's SDA</text>
<rect x="484.0" y="358.86400000000003" width="12" height="6" fill="#111"/>
<polyline points="496.0,361.9 560.0,361.9 590.0,379.3 640.0,379.3" fill="none" stroke="#9467bd" stroke-width="3" stroke-linejoin="round"/>
<text x="646.0" y="383.3" font-size="11" text-anchor="start" font-weight="bold" fill="#9467bd" font-family="Helvetica, Arial, sans-serif">pin 3 SCL  to the pad's SCL</text>
<text x="560.0" y="311.3" font-size="11" text-anchor="middle" font-weight="bold" fill="#222" font-family="Helvetica, Arial, sans-serif">J_LEFT3</text>
<text x="30.0" y="470.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Solder short stranded wires to the pad's VDDHI, VSS, SDA, SCL and RDY pads, with male Dupont pins at the far end.</text>
<text x="30.0" y="488.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Leave NRST unconnected: the IQS572 pulls it up itself.</text>
<text x="30.0" y="506.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Switch the half off before you plug the jumpers in. With the pad in the sockets, this half reads 0 key modules.</text>
<text x="30.0" y="524.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Tape a 1 to 2 mm plastic overlay on the pad's face, without air gaps, and leave solder link S1 open.</text>
</svg>
