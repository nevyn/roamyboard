<text x="600.0" y="120.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#222" font-family="Helvetica, Arial, sans-serif">Bench: jumpers into the MCU module's sockets</text>
<text x="600.0" y="136.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#555" font-family="Helvetica, Arial, sans-serif">socket face of the rewired MCU module, no key modules attached</text>
