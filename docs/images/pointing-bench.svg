<text x="30.0" y="69.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">The datasheet draws only the GPIO variant (silkscreen IO1..IO5, GND, 3V3); the I2C mapping is not published.</text>
