<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560"><rect width="980" height="560" fill="#fff"/>
<text x="30.0" y="36.0" font-size="16" text-anchor="start" font-weight="bold" fill="#222" font-family="Helvetica, Arial, sans-serif">Wire the TPS48 to the MCU module's sockets</text>
<text x="30.0" y="54.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Pads by their silkscreen on the trackpad's back, in order from the notch end. Schematic, not to scale.</text>
<path d="M60,144.0 H184.0 L216.0,176.0 V428.0 H60 Z" fill="#3d2b5a" stroke="#222"/>
<text x="206.0" y="136.0" font-size="10" text-anchor="end" font-weight="normal" fill="#555" font-family="Helvetica, Arial, sans-serif">notch end</text>
<text x="110.0" y="290.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#eee" font-family="Helvetica, Arial, sans-serif">TPS48 back</text>
<rect x="194.0" y="171.0" width="16" height="14" fill="#c9a227"/>
<text x="188.0" y="183.0" font-size="13" text-anchor="end" font-weight="bold" fill="#fff" font-family="Helvetica, Arial, sans-serif">IO4</text>
<text x="222.0" y="182.0" font-size="10" text-anchor="start" font-weight="normal" fill="#999" font-family="Helvetica, Arial, sans-serif">leave empty</text>
<rect x="194.0" y="207.0" width="16" height="14" fill="#c9a227"/>
<text x="188.0" y="219.0" font-size="13" text-anchor="end" font-weight="bold" fill="#fff" font-family="Helvetica, Arial, sans-serif">IO5</text>
<rect x="194.0" y="243.0" width="16" height="14" fill="#c9a227"/>
<text x="188.0" y="255.0" font-size="13" text-anchor="end" font-weight="bold" fill="#fff" font-family="Helvetica, Arial, sans-serif">GND</text>
<rect x="194.0" y="279.0" width="16" height="14" fill="#c9a227"/>
<text x="188.0" y="291.0" font-size="13" text-anchor="end" font-weight="bold" fill="#fff" font-family="Helvetica, Arial, sans-serif">3V3</text>
<rect x="194.0" y="315.0" width="16" height="14" fill="#c9a227"/>
<text x="188.0" y="327.0" font-size="13" text-anchor="end" font-weight="bold" fill="#fff" font-family="Helvetica, Arial, sans-serif">IO1</text>
<rect x="194.0" y="351.0" width="16" height="14" fill="#c9a227"/>
<text x="188.0" y="363.0" font-size="13" text-anchor="end" font-weight="bold" fill="#fff" font-family="Helvetica, Arial, sans-serif">IO2</text>
<rect x="194.0" y="387.0" width="16" height="14" fill="#c9a227"/>
<text x="188.0" y="399.0" font-size="13" text-anchor="end" font-weight="bold" fill="#fff" font-family="Helvetica, Arial, sans-serif">IO3</text>
<text x="222.0" y="398.0" font-size="10" text-anchor="start" font-weight="normal" fill="#999" font-family="Helvetica, Arial, sans-serif">leave empty</text>
<rect x="640.0" y="160.0" width="40" height="260.0" rx="4" fill="#ddd" stroke="#888"/>
<text x="660.0" y="154.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#555" font-family="Helvetica, Arial, sans-serif">SW5 end (USB-C)</text>
<text x="660.0" y="434.0" font-size="9" text-anchor="middle" font-weight="normal" fill="#555" font-family="Helvetica, Arial, sans-serif">SW1 end</text>
<text x="660.0" y="450.0" font-size="10" text-anchor="middle" font-weight="normal" fill="#555" font-family="Helvetica, Arial, sans-serif">MCU module, socket face</text>
<rect x="654.0" y="197.45600000000002" width="12" height="6" fill="#111"/>
<polyline points="666.0,200.5 694.0,185.1 702.0,185.1" fill="none" stroke="#bbb" stroke-width="1" stroke-linejoin="round"/>
<text x="708.0" y="189.1" font-size="10" text-anchor="start" font-weight="normal" fill="#999" font-family="Helvetica, Arial, sans-serif">pin 1  +5V, later LED: leave empty</text>
<rect x="654.0" y="204.06" width="12" height="6" fill="#111"/>
<polyline points="210.0,286.0 450.0,286.0 450.0,207.1 654.0,207.1" fill="none" stroke="#d62728" stroke-width="3" stroke-linejoin="round"/>
<polyline points="666.0,207.1 694.0,207.1 702.0,207.1" fill="none" stroke="#d62728" stroke-width="1.5" stroke-linejoin="round"/>
<text x="708.0" y="211.1" font-size="11" text-anchor="start" font-weight="bold" fill="#d62728" font-family="Helvetica, Arial, sans-serif">pin 2  +3.3V  from 3V3</text>
<rect x="654.0" y="210.664" width="12" height="6" fill="#111"/>
<polyline points="210.0,250.0 390.0,250.0 390.0,213.7 654.0,213.7" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round"/>
<polyline points="666.0,213.7 694.0,229.1 702.0,229.1" fill="none" stroke="#222222" stroke-width="1.5" stroke-linejoin="round"/>
<text x="708.0" y="233.1" font-size="11" text-anchor="start" font-weight="bold" fill="#222222" font-family="Helvetica, Arial, sans-serif">pin 3  GND  from GND</text>
<text x="708.0" y="167.1" font-size="11" text-anchor="start" font-weight="bold" fill="#222" font-family="Helvetica, Arial, sans-serif">J_LEFT1</text>
<rect x="654.0" y="246.85599999999997" width="12" height="6" fill="#111"/>
<rect x="654.0" y="253.45999999999998" width="12" height="6" fill="#111"/>
<rect x="654.0" y="260.064" width="12" height="6" fill="#111"/>
<text x="708.0" y="260.5" font-size="10" text-anchor="start" font-weight="normal" fill="#999" font-family="Helvetica, Arial, sans-serif">J_LEFT2: leave empty</text>
<rect x="654.0" y="345.65599999999995" width="12" height="6" fill="#111"/>
<polyline points="210.0,214.0 330.0,214.0 330.0,348.7 654.0,348.7" fill="none" stroke="#17becf" stroke-width="3" stroke-linejoin="round"/>
<polyline points="666.0,348.7 694.0,333.3 702.0,333.3" fill="none" stroke="#17becf" stroke-width="1.5" stroke-linejoin="round"/>
<text x="708.0" y="337.3" font-size="11" text-anchor="start" font-weight="bold" fill="#17becf" font-family="Helvetica, Arial, sans-serif">pin 1  INT  from IO5</text>
<rect x="654.0" y="352.26" width="12" height="6" fill="#111"/>
<polyline points="210.0,358.0 570.0,358.0 570.0,355.3 654.0,355.3" fill="none" stroke="#1f77b4" stroke-width="3" stroke-linejoin="round"/>
<polyline points="666.0,355.3 694.0,355.3 702.0,355.3" fill="none" stroke="#1f77b4" stroke-width="1.5" stroke-linejoin="round"/>
<text x="708.0" y="359.3" font-size="11" text-anchor="start" font-weight="bold" fill="#1f77b4" font-family="Helvetica, Arial, sans-serif">pin 2  SDA  from IO2</text>
<rect x="654.0" y="358.86400000000003" width="12" height="6" fill="#111"/>
<polyline points="210.0,322.0 510.0,322.0 510.0,361.9 654.0,361.9" fill="none" stroke="#9467bd" stroke-width="3" stroke-linejoin="round"/>
<polyline points="666.0,361.9 694.0,377.3 702.0,377.3" fill="none" stroke="#9467bd" stroke-width="1.5" stroke-linejoin="round"/>
<text x="708.0" y="381.3" font-size="11" text-anchor="start" font-weight="bold" fill="#9467bd" font-family="Helvetica, Arial, sans-serif">pin 3  SCL  from IO1</text>
<text x="708.0" y="315.3" font-size="11" text-anchor="start" font-weight="bold" fill="#222" font-family="Helvetica, Arial, sans-serif">J_LEFT3</text>
<text x="30.0" y="470.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">IO3 and IO4 stay unconnected. The trackpad has no NRST pad: the IQS572 pulls it up itself.</text>
<text x="30.0" y="488.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">In IQS572 terms: IO5 is RDY (pin 8), IO2 SDA (pin 2), IO1 SCL (pin 3), 3V3 VDDHI (pin 4), GND VSS (pin 5).</text>
<text x="30.0" y="506.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Switch the half off before you plug the jumpers in. With the pad in the sockets, this half reads 0 key modules.</text>
<text x="30.0" y="524.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Tape a 1 to 2 mm plastic overlay on the pad's face, without air gaps, and leave solder link S1 open.</text>
</svg>
