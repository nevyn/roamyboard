<text x="30.0" y="658.0" font-size="11" text-anchor="start" font-weight="normal" fill="#222" font-family="Helvetica, Arial, sans-serif">Pin 1 of each connector is nearest the SW5 end (the USB-C end). J_LEFT1 pin 1 was +5V; nothing else uses it.</text>
